name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        run: node --test tests/context-verifier.test.mjs tests/remediator.test.mjs

      - name: Run integration tests
        run: node --test tests/integration.test.mjs

      - name: Smoke test CLI
        run: |
          node cli/macrc.mjs audit demo/bad-express-app --no-color --no-verify 2>/dev/null
          node cli/macrc.mjs audit demo/bad-express-app --format json --out /tmp/audit.json 2>/dev/null
          node cli/macrc.mjs fix demo/bad-express-app --dry-run --no-color 2>/dev/null
          node cli/macrc.mjs gate demo/bad-express-app --no-color 2>/dev/null || true
